[package]
name = "matugen-studio"
version = "0.1.0"
description = "A desktop app for generating and applying Matugen themes on Linux."
authors = ["raellx22"]
license = "GPL-2.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "matugen_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matugen-core = { path = "../matugen-core" }
material-colors = { version = "0.4.0", features = ["image", "serde"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
dirs = "5.0"
execute = "0.2.15"
toml = "0.8.8"
image = { version = "0.24.9", features = ["webp", "jpeg", "png"] }
sha2 = "0.10.8"
base64 = "0.22"
md5 = "0.7"
percent-encoding = "2"
png = "0.17"
tokio = { version = "1", features = ["time"] }
zbus = "5.15"
regex = "1"
