name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage
        env:
          NO_STRIP: "1"
        run: npm run tauri build -- --bundles appimage

      - name: Generate checksum
        working-directory: src-tauri/target/release/bundle/appimage
        run: sha256sum *.AppImage > SHA256SUMS

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: matugen-studio-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/SHA256SUMS
          if-no-files-found: error
